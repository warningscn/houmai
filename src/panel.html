<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>候脉 · 值守面板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%231f6feb'/%3E%3Cstop%20offset='1'%20stop-color='%230d419d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='url(%23g)'/%3E%3Cpolyline%20points='10,36%2022,36%2027,20%2033,48%2038,28%2042,36%2054,36'%20fill='none'%20stroke='%23fff'%20stroke-width='5'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#0b0f14; --panel:#131a22; --panel2:#0f151c; --line:#243040;
    --fg:#e6edf3; --dim:#8b98a8; --dim2:#5d6b7c;
    --ok:#3fb950; --bad:#f85149; --warn:#d29922; --accent:#58a6ff;
    --mono:"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  .wrap { max-width:1180px; margin:0 auto; padding:22px 20px 44px; }

  header { display:flex; align-items:center; justify-content:space-between;
           gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:42px; height:42px; flex:0 0 auto; }
  .logo svg { display:block; }
  .brand h1 { margin:0; font-size:19px; letter-spacing:.5px; }
  .brand p { margin:0; color:var(--dim); font-size:12px; }
  .head-right { text-align:right; }
  .meta { color:var(--dim2); font-size:12px; margin-top:6px; }

  .badge { display:inline-block; padding:5px 14px; border-radius:999px;
           font-size:13px; font-weight:600; border:1px solid transparent; }
  .badge.ok  { color:var(--ok);   background:rgba(63,185,80,.12);  border-color:rgba(63,185,80,.35); }
  .badge.bad { color:var(--bad);  background:rgba(248,81,73,.12);  border-color:rgba(248,81,73,.35); }

  .stopbtn { margin-left:10px; padding:5px 14px; border-radius:999px; cursor:pointer;
             font-size:13px; color:var(--dim); background:transparent;
             border:1px solid var(--line); transition:color .15s, border-color .15s; }
  .stopbtn:hover { color:var(--bad); border-color:var(--bad); }
  .stopbtn:disabled { color:var(--dim2); border-color:var(--line); cursor:default; opacity:.6; }
  /* 面板已停止时按钮切换为「启动面板」：淡蓝软胶囊，与徽标/pill 同一视觉语言；
     蓝色仍标记"下一步主动作"，悬停底色加深示意可点。不用实心——那是全页
     最重的色块，与暗底软胶囊体系不符。 */
  .stopbtn.start { color:var(--accent); background:rgba(88,166,255,.12);
                   border-color:rgba(88,166,255,.3);
                   transition:color .15s, border-color .15s, background .15s; }
  .stopbtn.start:hover { color:#79b8ff; background:rgba(88,166,255,.22);
                         border-color:rgba(88,166,255,.5); }
  .stopbtn.start:disabled { color:var(--accent); background:rgba(88,166,255,.12);
                            border-color:rgba(88,166,255,.3); opacity:.55; }

  /* 停止确认弹窗：主题内一致的自绘对话框，不用系统原生 confirm */
  .modal-mask { position:fixed; inset:0; background:rgba(4,8,12,.62);
    display:none; align-items:center; justify-content:center; z-index:50; }
  .modal-mask.show { display:flex; }
  .modal { width:min(400px,90vw); background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:22px 22px 18px; box-shadow:0 18px 50px rgba(0,0,0,.5);
    animation:modalpop .16s ease-out; }
  @keyframes modalpop { from { transform:scale(.94); opacity:0; } to { transform:scale(1); opacity:1; } }
  .modal h3 { margin:0 0 8px; font-size:15px; }
  .modal p { margin:0 0 18px; color:var(--dim); font-size:13px; line-height:1.7; }
  .modal .btnrow { display:flex; justify-content:flex-end; gap:10px; }
  .modal button { padding:7px 18px; border-radius:999px; cursor:pointer; font-size:13px;
    border:1px solid var(--line); background:transparent; color:var(--dim);
    transition:color .15s, border-color .15s, filter .15s; }
  .modal button:hover { color:var(--fg); border-color:var(--dim2); }
  .modal button.danger { color:#fff; background:var(--bad); border-color:var(--bad); }
  .modal button.danger:hover { color:#fff; filter:brightness(1.08); }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
           gap:12px; margin-bottom:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
          padding:14px 16px; border-left:3px solid var(--dim2); }
  .card.ok  { border-left-color:var(--ok); }
  .card.fail{ border-left-color:var(--bad); }
  .card.unknown { border-left-color:var(--warn); }
  .card .t { display:flex; align-items:center; justify-content:space-between;
             font-size:13px; color:var(--dim); margin-bottom:7px; }
  .card .t b { color:var(--fg); font-weight:600; font-size:14px; }
  .dot { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .dot.ok{background:var(--ok);} .dot.fail{background:var(--bad);} .dot.unknown{background:var(--warn);}
  .card .d { font-size:12.5px; color:var(--dim); line-height:1.55; word-break:break-word; }

  /* 与上方 .cards 同款三轨同间距：正常态体检恰好三张卡，「近 24 小时」
     占一轨即与「上次值守」等宽；「在册任务」横跨两轨。异常态体检多出
     卡片时上排收窄，属瞬态，不为它破坏常态对齐。 */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
  .grid > .panel:first-child { grid-column:span 2; }
  @media (max-width:820px){ .grid{grid-template-columns:1fr;}
    .grid > .panel:first-child{grid-column:auto;} }

  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px;
           padding:16px 18px; margin-bottom:16px; }
  .panel h2 { margin:0 0 13px; font-size:13px; font-weight:600; color:var(--dim);
              letter-spacing:1.2px; text-transform:uppercase;
              display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .panel h2 .dim { text-transform:none; letter-spacing:0; font-weight:400;
                   font-size:11.5px; color:var(--dim2); font-family:var(--mono); }

  .empty { color:var(--dim2); font-size:13px; padding:10px 0; }

  .task { background:var(--panel2); border:1px solid var(--line); border-radius:9px;
          padding:12px 14px; margin-bottom:10px; }
  .task:last-child { margin-bottom:0; }
  .task .top { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:7px; }
  .task .id { font-family:var(--mono); font-size:13px; color:var(--accent); font-weight:600; }
  .pill { font-size:11.5px; padding:2px 9px; border-radius:999px;
          background:rgba(88,166,255,.12); color:var(--accent); border:1px solid rgba(88,166,255,.3); }
  .pill.warn { background:rgba(210,153,34,.12); color:var(--warn); border-color:rgba(210,153,34,.35); }
  .pill.bad { background:rgba(248,81,73,.12); color:var(--bad); border-color:rgba(248,81,73,.35); }
  .attention { color:var(--warn); font-size:12px; margin-top:7px; }
  .task .row { font-size:12.5px; color:var(--dim); display:flex; gap:8px; }
  .task .row .k { color:var(--dim2); flex:0 0 62px; }
  .task .row .v { font-family:var(--mono); word-break:break-all; }
  .cd { font-family:var(--mono); color:var(--fg); font-weight:600; }

  .stat { display:flex; align-items:center; gap:10px; padding:8px 0;
          border-bottom:1px dashed var(--line); font-size:13px; }
  .stat:last-child { border-bottom:0; }
  .stat .n { font-family:var(--mono); font-size:18px; font-weight:600; min-width:34px; }
  .stat .lbl { color:var(--dim); flex:1; }
  .stat .when { color:var(--dim2); font-size:11.5px; font-family:var(--mono); }

  /* 日志直接落在卡片上：不套第二层框——背景/边框/圆角/内边距全去掉，
     否则卡片里还有一个"框"，正文被挤在框里，看着像套娃。
     限高与滚动必须保留：日志最多 200 行，去掉限高会把整个面板撑爆；
     "贴底才跟随"的滚动逻辑也依赖它可滚动。 */
  pre.log { margin:0; max-height:340px; overflow:auto;
            font-family:var(--mono); font-size:12px; line-height:1.75;
            color:var(--dim); white-space:pre-wrap; word-break:break-all;
            overscroll-behavior:contain; }
  pre.log .h  { color:var(--accent); font-weight:600; }
  pre.log .y  { color:var(--warn); }
  pre.log .r  { color:var(--bad); }

  /* 滚动条：系统默认是浅色粗条，压在深色面板上很扎眼。
     这里收细、压暗、做成内缩的圆角“浮动”条；只在悬停/拖动时才提亮。 */
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb {
    background:var(--line); border-radius:999px;
    border:2px solid transparent; background-clip:content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background:var(--dim2); background-clip:content-box; }
  ::-webkit-scrollbar-thumb:active { background:var(--accent); background-clip:content-box; }
  ::-webkit-scrollbar-corner { background:transparent; }
  /* 仅在没有 ::-webkit-scrollbar 的浏览器（Firefox）上兜底；
     若同时声明标准属性，Chromium 会反过来忽略上面那套精细样式。 */
  @supports not selector(::-webkit-scrollbar) {
    * { scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  }

  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; color:var(--dim2); font-weight:500; font-size:11.5px;
       letter-spacing:.6px; padding:0 10px 8px 0; border-bottom:1px solid var(--line); }
  td { padding:8px 10px 8px 0; border-bottom:1px solid rgba(36,48,64,.5); color:var(--dim); }
  tr:last-child td { border-bottom:0; }
  td.mono { font-family:var(--mono); color:var(--fg); }
  td.kind { color:var(--fg); }

  footer { color:var(--dim2); font-size:11.5px; text-align:center; margin-top:22px;
           font-family:var(--mono); }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 64 64" width="42" height="42" role="img" aria-label="候脉图标"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#0d419d"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#lg)"/><polyline points="10,36 22,36 27,20 33,48 38,28 42,36 54,36" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div>
        <h1>候脉</h1>
        <p>Codex 额度恢复值守 · 本地只读面板</p>
      </div>
    </div>
    <div class="head-right">
      <span id="verdict" class="badge">载入中…</span><button id="stopbtn" class="stopbtn" type="button" title="停止面板服务；值守不受影响">停止面板</button>
      <div class="meta">v<span id="ver">–</span> · 数据刷新于 <span id="refreshed">–</span></div>
      <div class="attention" id="attention" style="display:none"></div>
    </div>
  </header>

  <section class="cards" id="checks"></section>

  <div class="grid">
    <section class="panel">
      <h2>在册任务 <span class="dim" id="tasksum"></span></h2>
      <div id="tasks"></div>
    </section>
    <section class="panel">
      <h2>近 24 小时 <span class="dim" id="countsum"></span></h2>
      <div id="counts"></div>
      <div id="resumed"></div>
    </section>
  </div>

  <section class="panel">
    <h2>值守日志 <span class="dim" id="logmeta"></span></h2>
    <pre class="log" id="log"></pre>
  </section>

  <section class="panel">
    <h2>事件记录 <span class="dim" id="evmeta">载入中…</span></h2>
    <div id="events"></div>
  </section>

  <footer id="footer">候脉 · 面板只负责展示；续跑由值守计划任务自动进行，面板开关不影响值守</footer>
</div>

<div class="modal-mask" id="modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title">停止面板？</h3>
    <p>只关闭这个查看页，值守（计划任务）不受影响。<br>随时可以再点「启动面板」重开。</p>
    <div class="btnrow">
      <button type="button" id="mcancel">取消</button>
      <button type="button" class="danger" id="mok">停止面板</button>
    </div>
  </div>
</div>

<script>
const KIND = {
  detected:"检测到额度耗尽", long_cycle:"长周期额度 · 未排期",
  resumed:"续跑完成", retry:"等待重试", abandoned:"放弃续跑", superseded:"任务已自行继续",
  skipped_stale:"旧中断记录", already_progressed:"任务已自行继续",
  unknown_reset:"额度信息缺失 · 仅提醒", pruned:"在册任务归档"
};
const STATUS = {
  waiting:"等待窗口重置", retrying:"重试中", unconfirmed:"续跑待确认",
  notify_only:"仅提醒不续跑",
  succeeded:"已接回", abandoned:"放弃续跑", superseded:"任务已自行继续"
};
const ORIGIN = { "Codex Desktop":"桌面版", "codex-tui":"CLI" };
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const hhmm = t => {
  if(!t) return "–";
  const d = new Date(t*1000), p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
};
const dur = s => {
  s = Math.max(0, Math.round(s));
  if(s < 60) return s+" 秒";
  if(s < 3600) return Math.floor(s/60)+" 分"+(s%60 ? " "+s%60+" 秒" : "");
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h+" 小时"+(m ? " "+m+" 分" : "");
};

let DATA = null;

function render(d){
  DATA = d;
  document.getElementById("ver").textContent = d.version;
  document.getElementById("refreshed").textContent = d.now_clock;
  const v = document.getElementById("verdict");
  v.className = "badge " + (d.ok ? "ok" : "bad");
  v.textContent = d.verdict || (d.ok ? "值守正常" : "有待处理项");

  // 机制健康（绿）与"有任务需人工"是两层意思：徽标只报机制，
  // 待人工提示单独一行，免得"值守正常"给人"没事"的错觉。
  const att = document.getElementById("attention");
  if (att) {
    if (d.attention > 0) {
      att.style.display = "";
      att.textContent = `有 ${d.attention} 个任务需人工处理`;
    } else {
      att.style.display = "none";
    }
  }

  document.getElementById("checks").innerHTML = d.checks.map(c => `
    <div class="card ${c.state}">
      <div class="t"><b>${esc(c.label)}</b><span class="dot ${c.state}"></span></div>
      <div class="d">${esc(c.detail)}</div>
    </div>`).join("");

  const tasks = d.pending || [];
  const waiting = tasks.filter(t => t.status === "waiting" || t.status === "retrying");
  document.getElementById("tasksum").textContent =
    tasks.length ? `共 ${tasks.length} 个，等待中 ${waiting.length} 个` : "";
  document.getElementById("tasks").innerHTML = tasks.length ? tasks.map(t => `
    <div class="task">
      <div class="top">
        <span class="id">${esc(t.short)}</span>
        <span class="pill ${t.status === "abandoned" ? "bad" : (t.status === "unconfirmed" || t.status === "notify_only") ? "warn" : ""}">${esc(STATUS[t.status] || t.status)}</span>
        ${t.attempts ? `<span class="pill warn">已尝试 ${t.attempts} 次</span>` : ""}
      </div>
      ${(t.next_at && (t.status === "waiting" || t.status === "retrying" || t.status === "unconfirmed")) ? `<div class="row"><span class="k">${t.status === "unconfirmed" ? "复查截止" : "续跑时间"}</span>
        <span class="v">${esc(t.next_at)}（<span class="cd" data-at="${t.retry_at}"></span>${t.status === "unconfirmed" ? "后转人工" : "后"}）</span></div>` : ""}
      ${t.detected_local ? `<div class="row"><span class="k">检测于</span><span class="v">${esc(t.detected_local)}</span></div>` : ""}
      ${t.window_minutes ? `<div class="row"><span class="k">额度窗口</span>
        <span class="v">${t.window_minutes >= 1440 ? Math.round(t.window_minutes/1440)+" 天" : Math.round(t.window_minutes/60)+" 小时"}</span></div>` : ""}
      ${t.cwd ? `<div class="row"><span class="k">工作目录</span><span class="v">${esc(t.cwd)}</span></div>` : ""}
      ${t.originator ? `<div class="row"><span class="k">来源</span><span class="v">${esc(ORIGIN[t.originator] || t.originator)}</span></div>` : ""}
      ${(t.status === "abandoned" || t.status === "notify_only") && t.keep_until_local ? `<div class="row"><span class="k">归档</span>
        <span class="v">保留至 ${esc(t.keep_until_local)}，到期自动摘除</span></div>` : ""}
    </div>`).join("")
    : `<div class="empty">当前没有需要等待的任务。下一次真实额度耗尽时会自动接管。</div>`;

  const cs = Object.entries(d.counts_24h || {}).sort((a,b) => b[1]-a[1]);
  document.getElementById("countsum").textContent = cs.length ? "共 " + cs.reduce((s,x)=>s+x[1],0) + " 条事件" : "";
  document.getElementById("counts").innerHTML = cs.length ? cs.map(([k,n]) => `
    <div class="stat"><span class="n">${n}</span><span class="lbl">${esc(KIND[k] || k)}</span></div>`).join("")
    : `<div class="empty">无事件。没有额度耗尽就没有可做的动作，这不代表没在跑。</div>`;

  const resumed = (d.events || []).filter(e => e.kind === "resumed").slice(0,4);
  document.getElementById("resumed").innerHTML = resumed.length ? `
    <h2 style="margin:14px 0 8px">最近续跑核对</h2>` + resumed.map(e => `
    <div class="stat"><span class="mono" style="font-family:var(--mono);color:var(--accent)">${esc((e.root_id||"").slice(0,8))}</span>
      <span class="lbl">${e.verdict === "ok" ? "已确认开始新轮次" : e.verdict === "unknown" ? "已发出，未确认" : esc(e.verdict || "未确认")}</span>
      <span class="when">${esc(e.local || "")}</span></div>`).join("") : "";

  const log = d.log || [];
  document.getElementById("logmeta").textContent = d.log_mtime
    ? `最近更新于 ${dur(d.now - d.log_mtime)}前`
    : "尚未生成（值守跑过才有）";
  const box = document.getElementById("log");
  // 用户往上翻看历史时不能把位置抢走，只在"已经贴底"时跟随最新。
  const keepTop = box.dataset.stick === "0" ? box.scrollTop : null;
  box.innerHTML = log.length
    ? log.map(l => {
        const t = esc(l);
        if (/^\[.*\] —— /.test(l)) return `<span class="h">${t}</span>`;
        if (/失败|放弃|✗|错误/.test(l)) return `<span class="r">${t}</span>`;
        if (/完成|✓|已登记/.test(l)) return `<span class="y">${t}</span>`;
        return t;
      }).join("\n")
    : '<span style="color:var(--dim2)">暂无日志。</span>';
  bindLogScroll(box);
  box.scrollTop = keepTop === null ? box.scrollHeight : keepTop;

  const evs = d.events || [];
  const st = d.stale_summary;
  // 标题只说主人关心的两件事：看多久、没看到的那部分去了哪。
  // "至多 10 条"是实现规则不进标题；真有更早记录被收起时，一句"未列出"足矣。
  let em = "近 " + (d.history_days != null ? d.history_days : 3) + " 天";
  const hiddenMore = (d.events_filtered || 0) + (d.events_hidden || 0);
  if (hiddenMore) em += " · 另有更早 " + hiddenMore + " 条未列出";
  if (d.events_merged) em += " · 同一次中断的重复过程已合并 " + d.events_merged + " 条";
  document.getElementById("evmeta").textContent = em;
  const staleNote = st ? `<div class="empty">已折叠 ${st.count} 条很早以前的中断跳过记录${
      st.oldest_hours != null ? `，最早约 ${Math.max(1, Math.round(st.oldest_hours/24))} 天前` : ""
    }。这类记录描述的是当时的判断过程，不是实际动作，属正常噪声；如需查看，可在配置文件中把 show_skipped_stale 设为 true。</div>` : "";
  document.getElementById("events").innerHTML = staleNote + (evs.length ? `
    <table><thead><tr><th>时间</th><th>事件</th><th>任务</th><th>详情</th></tr></thead><tbody>
    ${evs.map(e => `<tr>
      <td class="mono">${esc(e.local || "")}</td>
      <td class="kind">${esc(KIND[e.kind] || e.kind || "?")}</td>
      <td class="mono">${esc((e.root_id||"—").slice(0,8))}</td>
      <td>${esc(detail(e))}</td></tr>`).join("")}
    </tbody></table>`
    : `<div class="empty">近 ${d.history_days != null ? d.history_days : 3} 天内没有事件记录。</div>`);

  document.getElementById("footer").textContent =
    "候脉 · 面板只负责展示；续跑由值守计划任务自动进行，面板开关不影响值守";
}

function detail(e){
  if(e.kind === "resumed") {
    const v = e.verdict === "ok" ? "已确认开始新轮次"
      : e.verdict === "unknown" ? "已发出，未确认新轮次"
      : (e.verdict || "未知");
    const ch = e.via === "ipc" ? "，经桌面窗口送达" : e.via === "exec" ? "，经命令行送达" : "";
    return "核对结果 " + v + ch + (e.elapsed ? "，耗时 " + Math.round(e.elapsed) + " 秒" : "");
  }
  if(e.kind === "detected"){
    const wm = (e.window && e.window.window_minutes) || 0;
    const win = !wm ? "未知" : (wm >= 1440 ? Math.round(wm/1440) + " 天" : Math.round(wm/60) + " 小时");
    return "额度窗口 " + win
      + (e.window && e.window.borrowed ? "（取自同账号最近观测）" : "")
      + "，定于 " + hhmm(e.retry_at) + " 续跑";
  }
  if(e.kind === "retry") return "第 " + (e.attempts||"") + " 次未成功，稍后重试"
    + (e.via === "ipc" ? "（桌面通道）" : e.via === "exec" ? "（命令行通道）" : "");
  if(e.kind === "abandoned") return "原因：" + (e.reason || "未知");
  if(e.kind === "pruned") return "已从在册摘除"
    + (e.status === "succeeded" ? "（此前已接回）" : e.status === "superseded" ? "（任务已自行继续）" : "")
    + (e.kept_days != null ? "，结案 " + (e.kept_days >= 1 ? Math.round(e.kept_days) + " 天前" : "不足一天") : "");
  if(e.kind === "skipped_stale") return "约 " + (e.age_hours || "?") + " 小时前的历史中断";
  if(e.kind === "already_progressed") return "中断后已自行继续，无需接管"
    + (e.repeat ? "（同会话 " + e.repeat + " 个中断轮次）" : "");
  if(e.kind === "long_cycle"){
    const why = e.reason === "beyond_max_wait" ? "重置时间超出等待上限"
      : e.reason === "switch_off" ? "长周期自动续跑已关闭" : "按策略";
    return "长周期额度，未排期续跑（" + why + "），仅提醒";
  }
  if(e.kind === "unknown_reset") return "会话里读不到额度信息，无法排期，已转人工";
  return "";
}

// 日志区只在"贴底"时跟随最新；用户滚上去看历史时不打扰。
// innerHTML 每次刷新都会被替换，所以监听器只绑一次。
function bindLogScroll(box){
  if(box.dataset.bound) return;
  box.dataset.bound = "1";
  box.dataset.stick = "1";
  box.addEventListener("scroll", () => {
    const gap = box.scrollHeight - box.scrollTop - box.clientHeight;
    box.dataset.stick = gap < 8 ? "1" : "0";
  });
}

// 停止面板服务：只关这个查看页背后的本地 HTTP 服务，值守（计划任务）不受影响。
// 停止后按钮变成「启动面板」：通过 houmai:// 协议拉起后台进程（选 3 注册时安装），
// 页面每 2 秒探测一次，面板回来后自动恢复显示。
let PANEL_STOPPED = false, restartTimer = null;
const stopbtn = document.getElementById("stopbtn");
const modal = document.getElementById("modal");

function doStop(){
  try { fetch("/api/stop", {method:"POST", headers:{"X-Houmai-Stop":"1"}}); } catch(e) {}
  PANEL_STOPPED = true;
  const v = document.getElementById("verdict");
  v.className = "badge";
  v.textContent = "面板已停止（值守不受影响）";
  stopbtn.classList.add("start");
  stopbtn.textContent = "启动面板";
  stopbtn.title = "重新打开面板；若无反应请双击 houmai.cmd 选 1";
}

stopbtn.addEventListener("click", () => {
  if(PANEL_STOPPED){
    // 启动：协议处理器拉起隐藏进程，这里只管等它就绪。
    try { location.href = "houmai://panel"; } catch(e) {}
    stopbtn.disabled = true;
    stopbtn.textContent = "启动中…";
    if(restartTimer) clearInterval(restartTimer);
    const t0 = Date.now();
    restartTimer = setInterval(async () => {
      let up = false;
      try { up = (await fetch("/api/status", {cache:"no-store"})).ok; } catch(e) {}
      if(up){
        clearInterval(restartTimer); restartTimer = null;
        PANEL_STOPPED = false;
        stopbtn.disabled = false;
        stopbtn.classList.remove("start");
        stopbtn.textContent = "停止面板";
        stopbtn.title = "停止面板服务；值守不受影响";
        tick();
        return;
      }
      if(Date.now() - t0 > 60000){
        clearInterval(restartTimer); restartTimer = null;
        stopbtn.disabled = false;
        stopbtn.textContent = "启动面板";
      }
    }, 2000);
    return;
  }
  modal.classList.add("show");
});

document.getElementById("mcancel").addEventListener("click", () => modal.classList.remove("show"));
modal.addEventListener("click", e => { if(e.target === modal) modal.classList.remove("show"); });
document.addEventListener("keydown", e => { if(e.key === "Escape") modal.classList.remove("show"); });
document.getElementById("mok").addEventListener("click", () => {
  modal.classList.remove("show");
  doStop();
});

let LAST_REV = null;
async function tick(){
  if(PANEL_STOPPED) return;
  try {
    const r = await fetch("/api/status", {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    // 内容没变（指纹相同）就只更新刷新时间戳，不重画——
    // 任务卡不闪，倒计时由每秒的本地更新器继续走。
    document.getElementById("refreshed").textContent = d.now_clock;
    if(d.rev && d.rev === LAST_REV) return;
    LAST_REV = d.rev || null;
    render(d);
  } catch(err) {
    const v = document.getElementById("verdict");
    v.className = "badge bad";
    v.textContent = "面板连不上值守进程";
    document.getElementById("refreshed").textContent = String(err.message || err);
  }
}

setInterval(() => {
  if(!DATA) return;
  document.querySelectorAll(".cd").forEach(el => {
    el.textContent = dur(el.dataset.at - Date.now()/1000);
  });
}, 1000);

tick();
setInterval(tick, 5000);
</script>
</body>
</html>
